name: Karamürsel Tahsin APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Kodu indir
        uses: actions/checkout@v4

      - name: Java 17 kur
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.9 kur
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: APK projesini ZIP'ten çıkar
        shell: bash
        run: |
          rm -rf apk_project
          mkdir -p apk_project
          unzip -q "Karamursel_Tahsin_APK_Projesi.zip" -d apk_project
          SETTINGS_FILE="$(find apk_project -name settings.gradle -type f -print -quit)"
          if [ -z "$SETTINGS_FILE" ]; then
            echo "settings.gradle bulunamadı"
            exit 1
          fi
          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Proje bulundu: $PROJECT_DIR"

      - name: Kapağı Android projesine ekle
        shell: bash
        run: |
          mkdir -p "$PROJECT_DIR/app/src/main/res/drawable"
          cp kapak.png "$PROJECT_DIR/app/src/main/res/drawable/kapak.png"

      - name: APK oluştur
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug

      - name: APK'yı yükle
        uses: actions/upload-artifact@v4
        with:
          name: Karamursel-Tahsin-APK
          path: "**/build/outputs/apk/debug/*.apk"
