name: Karamürsel Tahsin APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Kodu indir
        uses: actions/checkout@v4

      - name: Java 17 kur
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.7 kur
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: APK projesini ZIP'ten çıkar
        run: |
          mkdir apk_project
          unzip -q Karamursel_Tahsin_APK_Projesi.zip -d apk_project
          PROJECT_DIR=$(dirname "$(find apk_project -name settings.gradle -print -quit)")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: APK oluştur
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug

      - name: APK'yı yükle
        uses: actions/upload-artifact@v4
        with:
          name: Karamursel-Tahsin-APK
          path: |
            **/build/outputs/apk/debug/*.apk
